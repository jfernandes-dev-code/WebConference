<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
    />
    <title>WebConference</title>

    <style>
      /* O CSS deve ficar aqui ou num ficheiro externo */
      header.masthead {
        text-align: center;
        color: white;
        background-color: #333; /* Cor de fundo caso a imagem falhe */
        background-image: url("https://images.unsplash.com/photo-1505373877841-8d25f7d46678?auto=format&fit=crop&w=1350&q=80");
        background-repeat: no-repeat;
        background-attachment: scroll;
        background-position: center;
        background-size: cover;
        height: 60vh; /* Define uma altura para vermos o fundo */
        display: flex;
        align-items: center;
        justify-content: center;
      }

      header.masthead .intro-text {
        font-size: 50px;
        font-weight: bold;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
      }

      section {
        padding: 60px 0;
        min-height: 300px;
        border-bottom: 1px solid #eee;
      }
    </style>
  </head>
  <body id="page-top">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
      <div class="container">
        <a class="navbar-brand" href="#page-top">WebConference</a>
        <button
          class="navbar-toggler"
          type="button"
          data-toggle="collapse"
          data-target="#navbarResponsive"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarResponsive">
          <ul class="navbar-nav text-uppercase ml-auto">
            <li class="nav-item">
              <a class="nav-link" href="#Sobre">Sobre</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#Oradores">Oradores</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#Patrocinadores">Patrocinadores</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#Contatos">Contato</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <header class="masthead">
      <div class="container">
        <div class="intro-text">
          Vamos celebrar a Web!<br />
          <small>WEBCONFERENCE</small>
        </div>
      </div>
    </header>

    <section id="Sobre" class="container"><h2>Sobre a Conferência</h2></section>
    <section id="Oradores" class="container"><h2>Oradores</h2></section>
    <section id="Patrocinadores" class="container">
      <h2>Patrocinadores</h2>
    </section>
    <section id="Contatos" class="container"><h2>Contatos</h2></section>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
  </body>
</html>
